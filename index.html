<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PetFinder helps lost and found pets reunite with their families in Santa Cruz, Bolivia.">
  <title>PetFinder - Find Your Best Friend</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3jK0Q0v4K6hYQJ8H5n1Z7F4M2l3Y=" crossorigin="">

  <style>
    /* =====================================================
        PETCO-INSPIRED THEME (RED & WHITE)
    ====================================================== */
    :root {
      --primary-red: #e31837;
      --primary-red-hover: #c4122d;
      --bg-white: #ffffff;
      --bg-light-gray: #f4f6f8;
      --text-dark: #001952;
      --text-gray: #666666;
      --border-color: #e0e0e0;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-pill: 50px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background-color: var(--bg-light-gray); color: var(--text-dark); line-height: 1.5; }
    .hidden { display: none !important; }

    /* BUTTONS */
    button { cursor: pointer; font-family: inherit; transition: all 0.2s ease; }
    .primary-button {
      background-color: var(--primary-red); color: white; border: none; 
      padding: 12px 24px; border-radius: var(--radius-pill); font-weight: bold; font-size: 1rem;
    }
    .primary-button:hover { background-color: var(--primary-red-hover); transform: translateY(-1px); }
    .secondary-button, .outline-button {
      background-color: transparent; color: var(--primary-red); border: 2px solid var(--primary-red);
      padding: 10px 24px; border-radius: var(--radius-pill); font-weight: bold;
    }
    .secondary-button:hover { background-color: #fdf0f1; }
    
    /* FORMS */
    .form-input, .textarea, select {
      width: 100%; padding: 12px; border: 1px solid var(--border-color);
      border-radius: var(--radius-sm); margin-top: 6px; font-size: 1rem; background: white;
    }
    .field-label { font-weight: 600; font-size: 0.9rem; color: var(--text-dark); display: block; margin-top: 15px; }

    /* NAVBAR */
    .navbar { background-color: var(--bg-white); border-bottom: 1px solid var(--border-color); padding: 16px 5%; position: sticky; top: 0; z-index: 100; }
    .nav-inner { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; }
    .logo-button { background: none; border: none; font-size: 1.5rem; font-weight: 800; color: var(--primary-red); display: flex; align-items: center; gap: 8px; }
    .desktop-nav { display: flex; gap: 10px; }
    .nav-button { background: none; border: none; font-size: 1rem; color: var(--text-gray); font-weight: 600; padding: 8px 12px; border-radius: var(--radius-pill); }
    .nav-button.active, .nav-button:hover { color: var(--primary-red); background-color: #fdf0f1; }
    .nav-user { display: flex; align-items: center; gap: 15px; }

    /* APP LAYOUT */
    .page-container { max-width: 1200px; margin: 40px auto; padding: 0 5%; }
    .view-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .view-header h2 { font-size: 1.8rem; color: var(--text-dark); }
    
    .map-toggle-btn {
      background-color: white; border: 2px solid var(--primary-red); color: var(--primary-red);
      padding: 10px 20px; border-radius: var(--radius-pill); font-weight: bold;
      display: flex; align-items: center; gap: 8px;
    }

    /* PET GRID */
    .pet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 24px; }
    .pet-card {
      background: var(--bg-white); border-radius: var(--radius-md); overflow: hidden;
      box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); transition: transform 0.2s;
    }
    .pet-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
    .pet-card-img { width: 100%; height: 200px; background-color: #e9ecef; object-fit: cover; }
    .pet-card-info { padding: 16px; }
    .pet-card-status { display: inline-block; padding: 4px 10px; border-radius: var(--radius-pill); font-size: 0.8rem; font-weight: bold; margin-bottom: 8px; }
    .status-lost { background-color: #fff3cd; color: #856404; }
    .status-found { background-color: #d4edda; color: #155724; }
    .status-reunited { background-color: #cce5ff; color: #004085; }
    .pet-card-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 4px; }
    .pet-card-desc { font-size: 0.9rem; color: var(--text-gray); }

    /* MAP VIEW */
    .map-container { height: 500px; width: 100%; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
    
    /* REPORT CARD */
    .form-card { background: white; padding: 30px; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); max-width: 700px; margin: 0 auto; }

    /* DETAIL MODAL */
    .pet-modal { border: none; border-radius: var(--radius-md); max-width: 800px; width: 90%; margin: auto; padding: 0; box-shadow: var(--shadow-md); }
    .pet-modal::backdrop { background: rgba(0,0,0,0.5); }
    .modal-content { display: flex; flex-direction: column; gap: 20px; padding: 30px; position: relative; }
    .modal-close { position: absolute; top: 15px; right: 15px; background: #f1f1f1; border: none; border-radius: 50%; width: 35px; height: 35px; font-weight: bold; cursor: pointer; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .detail-grid { grid-template-columns: 1fr; } }
    .detail-img-box { background: #eee; border-radius: var(--radius-md); height: 300px; width: 100%; object-fit: cover; }
    .detail-info-box { background: var(--bg-light-gray); padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--border-color); }
    .detail-info-box h3 { margin-bottom: 10px; color: var(--primary-red); }

    /* AUTH PAGE */
    .auth-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .auth-card { background: white; padding: 40px; border-radius: var(--radius-md); box-shadow: var(--shadow-md); max-width: 400px; width: 100%; text-align: center; }
    .auth-card h1 { color: var(--primary-red); margin-bottom: 10px; }
    .auth-form { display: flex; flex-direction: column; gap: 15px; text-align: left; margin-top: 20px; }
    .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .auth-tab { flex: 1; padding: 10px; border: none; background: #eee; border-radius: var(--radius-pill); font-weight: bold; color: var(--text-gray); }
    .auth-tab.active { background: var(--primary-red); color: white; }
  </style>
</head>

<body>

  <!-- AUTH SCREEN -->
  <section id="authPage" class="auth-page">
    <div class="auth-card">
      <h1>🐾 PetFinder</h1>
      <p style="color: var(--text-gray); margin-bottom: 20px;">Helping lost pets find their way home.</p>
      
      <div class="auth-tabs">
        <button id="loginTab" class="auth-tab active">Login</button>
        <button id="signupTab" class="auth-tab">Sign Up</button>
      </div>

      <form id="loginForm" class="auth-form">
        <div>
          <label class="field-label" style="margin-top:0;">Email</label>
          <input type="email" class="form-input" placeholder="you@example.com" value="user@example.com" required>
        </div>
        <div>
          <label class="field-label">Password</label>
          <input type="password" class="form-input" placeholder="Your password" value="password" required>
        </div>
        <button type="submit" class="primary-button" style="margin-top: 10px;">Login</button>
      </form>
    </div>
  </section>

  <!-- APP SHELL -->
  <div id="app" class="hidden">
    
    <header class="navbar">
      <div class="nav-inner">
        <button class="logo-button" data-page="home">
          🐾 PetFinder
        </button>
        
        <nav class="desktop-nav">
          <button data-page="home" class="nav-button active">Find Pets</button>
          <button data-page="report" class="nav-button">Report Pet</button>
          <button data-page="dashboard" class="nav-button">My Reports</button>
        </nav>

        <div class="nav-user">
          <span id="navUserName">User</span>
          <button id="logoutButton" class="secondary-button" style="padding: 6px 16px;">Logout</button>
        </div>
      </div>
    </header>

    <!-- HOME / PET GRID VIEW -->
    <main id="homePage" class="page-container">
      <div class="view-header">
        <h2>Pets Found & Lost in Santa Cruz</h2>
        <button id="toggleMapBtn" class="map-toggle-btn">
          📍 PetMap View
        </button>
      </div>

      <!-- LIST VIEW -->
      <div id="listView" class="pet-grid">
        <!-- Dynamically rendered cards go here -->
      </div>

      <!-- MAP VIEW -->
      <div id="mapView" class="hidden">
        <p style="margin-bottom: 15px; color: var(--text-gray);">Showing lost/found pets across Santa Cruz.</p>
        <div id="petMap" class="map-container"></div>
      </div>
    </main>

    <!-- REPORT PET VIEW -->
    <main id="reportPage" class="page-container hidden">
      <div class="form-card">
        <h2 style="color: var(--primary-red); margin-bottom: 5px;">Report a Lost or Found Pet</h2>
        <p style="color: var(--text-gray); margin-bottom: 20px;">Fill out the details below to notify the community.</p>
        
        <form id="reportForm">
          <label class="field-label" style="margin-top:0;">Report Type</label>
          <select id="reportStatus" class="form-input" required>
            <option value="Lost">Lost Pet</option>
            <option value="Found">Found Pet</option>
          </select>

          <label class="field-label">Pet Name or Description</label>
          <input type="text" id="reportName" class="form-input" placeholder="e.g. Max or Brown Puppy" required>

          <label class="field-label">Breed / Type</label>
          <input type="text" id="reportBreed" class="form-input" placeholder="e.g. Golden Retriever, Tabby Cat" required>

          <label class="field-label">Last Seen / Found Location</label>
          <input type="text" id="reportLocation" class="form-input" placeholder="e.g. Equipetrol, Santa Cruz" required>

          <label class="field-label">Contact Phone Number</label>
          <input type="text" id="reportPhone" class="form-input" placeholder="+591 7000-0000" required>

          <label class="field-label">Additional Details & Characteristics</label>
          <textarea id="reportDesc" class="textarea" rows="4" placeholder="Describe collar, behavior, specific marks..." required></textarea>

          <label class="field-label">Image URL</label>
          <input type="url" id="reportImg" class="form-input" placeholder="https://images.unsplash.com/..." value="https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?auto=format&fit=crop&w=400&q=80" required>

          <button type="submit" class="primary-button" style="width: 100%; margin-top: 25px;">Submit Report</button>
        </form>
      </div>
    </main>

    <!-- DASHBOARD VIEW -->
    <main id="dashboardPage" class="page-container hidden">
      <div class="view-header">
        <h2>My Submitted Reports</h2>
      </div>
      <div id="userReportsView" class="pet-grid">
        <!-- User submitted items will show here -->
      </div>
    </main>

  </div>

  <!-- PET DETAILS MODAL -->
  <dialog id="petModal" class="pet-modal">
    <button class="modal-close" onclick="document.getElementById('petModal').close()">✕</button>
    <div class="modal-content" id="modalBody">
      <!-- Dynamic modal content -->
    </div>
  </dialog>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDIy47-9kwKCtaJu75oln7lMBpxUphWA_A",
      authDomain: "don-bosco-theater.firebaseapp.com",
      projectId: "don-bosco-theater",
      storageBucket: "don-bosco-theater.firebasestorage.app",
      messagingSenderId: "270986848021",
      appId: "1:270986848021:web:49e21ab57699ca4eb32b1c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let petsData = [];

    // Load pets data from Firestore on start
    async function loadPets() {
      try {
        const querySnapshot = await getDocs(collection(db, "found_pets"));
        petsData = [];
        querySnapshot.forEach((docSnap) => {
          petsData.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderPets();
      } catch (error) {
        console.error("Error loading pets: ", error);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadPets();

      // Login interaction
      document.querySelector('#loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        document.getElementById('authPage').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        renderPets();
      });

      // Navigation switching
      const navButtons = document.querySelectorAll('.desktop-nav button, .logo-button');
      navButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const page = btn.getAttribute('data-page');
          if(!page) return;

          document.querySelectorAll('.desktop-nav .nav-button').forEach(nb => nb.classList.remove('active'));
          if(btn.classList.contains('nav-button')) btn.classList.add('active');

          document.getElementById('homePage').classList.add('hidden');
          document.getElementById('reportPage').classList.add('hidden');
          document.getElementById('dashboardPage').classList.add('hidden');

          if(page === 'home') document.getElementById('homePage').classList.remove('hidden');
          if(page === 'report') document.getElementById('reportPage').classList.remove('hidden');
          if(page === 'dashboard') {
            document.getElementById('dashboardPage').classList.remove('hidden');
            renderUserReports();
          }
        });
      });

      // Logout handler
      document.getElementById('logoutButton').addEventListener('click', () => {
        document.getElementById('app').classList.add('hidden');
        document.getElementById('authPage').classList.remove('hidden');
      });

      // Toggle Map/List Views
      const toggleBtn = document.getElementById('toggleMapBtn');
      const listView = document.getElementById('listView');
      const mapView = document.getElementById('mapView');
      let isMap = false;

      toggleBtn.addEventListener('click', () => {
        isMap = !isMap;
        if(isMap) {
          listView.classList.add('hidden');
          mapView.classList.remove('hidden');
          toggleBtn.innerHTML = '📋 List View';
          initMap();
        } else {
          listView.classList.remove('hidden');
          mapView.classList.add('hidden');
          toggleBtn.innerHTML = '📍 PetMap View';
        }
      });

      // Handle New Report Submission
      document.getElementById('reportForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const newPet = {
          status: document.getElementById('reportStatus').value,
          name: document.getElementById('reportName').value,
          breed: document.getElementById('reportBreed').value,
          location: document.getElementById('reportLocation').value,
          phone: document.getElementById('reportPhone').value,
          desc: document.getElementById('reportDesc').value,
          img: document.getElementById('reportImg').value,
          lat: -17.7833 + (Math.random() - 0.5) * 0.05,
          lng: -63.1821 + (Math.random() - 0.5) * 0.05,
          createdAt: Date.now()
        };

        try {
          const docRef = await addDoc(collection(db, "found_pets"), newPet);
          petsData.unshift({ id: docRef.id, ...newPet });
          renderPets();

          document.getElementById('reportForm').reset();
          document.querySelector('[data-page="home"]').click();
        } catch (error) {
          console.error("Error adding document: ", error);
          alert("Error saving report to database.");
        }
      });
    });

    // Render Pets into Grid
    window.renderPets = function() {
      const listView = document.getElementById('listView');
      listView.innerHTML = '';

      if (petsData.length === 0) {
        listView.innerHTML = `<p style="color: var(--text-gray);">No pets reported yet.</p>`;
        return;
      }

      petsData.forEach(pet => {
        const card = document.createElement('div');
        card.className = 'pet-card';
        let statusClass = 'status-lost';
        if (pet.status === 'Found') statusClass = 'status-found';
        if (pet.status === 'Reunited') statusClass = 'status-reunited';

        card.innerHTML = `
          <img src="${pet.img}" alt="${pet.name}" class="pet-card-img">
          <div class="pet-card-info">
            <span class="pet-card-status ${statusClass}">${pet.status}</span>
            <div class="pet-card-title">${pet.name}</div>
            <div class="pet-card-desc">📍 ${pet.location}</div>
            <button class="outline-button" style="width:100%; margin-top: 15px;" onclick="openModal('${pet.id}')">Info about pet</button>
          </div>
        `;
        listView.appendChild(card);
      });
    }

    // Render User Reports dashboard view
    window.renderUserReports = function() {
      const userReportsView = document.getElementById('userReportsView');
      userReportsView.innerHTML = '';

      if (petsData.length === 0) {
        userReportsView.innerHTML = `<p style="color: var(--text-gray);">You have not submitted any reports.</p>`;
        return;
      }

      petsData.forEach(pet => {
        const card = document.createElement('div');
        card.className = 'pet-card';
        let statusClass = 'status-lost';
        if (pet.status === 'Found') statusClass = 'status-found';
        if (pet.status === 'Reunited') statusClass = 'status-reunited';

        card.innerHTML = `
          <img src="${pet.img}" alt="${pet.name}" class="pet-card-img">
          <div class="pet-card-info">
            <span class="pet-card-status ${statusClass}">${pet.status}</span>
            <div class="pet-card-title">${pet.name}</div>
            <div class="pet-card-desc">📍 ${pet.location}</div>
            <button class="outline-button" style="width:100%; margin-top: 15px;" onclick="openModal('${pet.id}')">View Report</button>
          </div>
        `;
        userReportsView.appendChild(card);
      });
    }

    // Open Dynamic Modal Details with Reunited Option
    window.openModal = function(id) {
      const pet = petsData.find(p => p.id === id);
      if(!pet) return;

      const modalBody = document.getElementById('modalBody');
      const isReunited = pet.status === 'Reunited';

      modalBody.innerHTML = `
        <button class="modal-close" onclick="document.getElementById('petModal').close()">✕</button>
        <h2 style="text-align: center; border-bottom: 2px solid var(--bg-light-gray); padding-bottom: 15px;">${pet.status} Pet Details</h2>
        
        <div class="detail-grid">
          <div>
            <img src="${pet.img}" alt="${pet.name}" class="detail-img-box">
          </div>
          <div style="display: flex; flex-direction: column; gap: 15px;">
            <div class="detail-info-box">
              <h3>Name, Breed & Contact</h3>
              <p><strong>Name/Title:</strong> ${pet.name}</p>
              <p><strong>Breed:</strong> ${pet.breed}</p>
              <p><strong>Location:</strong> ${pet.location}</p>
              <p><strong>Contact Phone:</strong> ${pet.phone}</p>
              ${isReunited ? `<p style="margin-top:8px; color: #004085; font-weight:bold;">🎉 Reunited with Owner!</p>` : ''}
            </div>
            <div class="detail-info-box">
              <h3>Characteristics & Info</h3>
              <p>${pet.desc}</p>
            </div>
            ${!isReunited ? `
              <button class="primary-button" onclick="markReunited('${pet.id}')" style="background-color: #28a745;">Mark as Reunited with Owner</button>
            ` : ''}
          </div>
        </div>
      `;
      document.getElementById('petModal').showModal();
    }

    // Function to update status to Reunited in Firestore
    window.markReunited = async function(id) {
      try {
        const petRef = doc(db, "found_pets", id);
        await updateDoc(petRef, {
          status: "Reunited",
          returnedAt: Date.now()
        });

        // Update local state
        const pet = petsData.find(p => p.id === id);
        if (pet) pet.status = "Reunited";

        renderPets();
        document.getElementById('petModal').close();
        alert("Pet status updated to Reunited!");
      } catch (error) {
        console.error("Error updating status: ", error);
        alert("Failed to update status.");
      }
    }

    // Leaflet Map Initialization
    let mapInstance = null;
    function initMap() {
      if (!mapInstance) {
        mapInstance = L.map('petMap').setView([-17.7833, -63.1821], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19
        }).addTo(mapInstance);
      } else {
        mapInstance.invalidateSize();
      }

      mapInstance.eachLayer(layer => {
        if (layer instanceof L.Marker) {
          mapInstance.removeLayer(layer);
        }
      });

      petsData.forEach(pet => {
        if(pet.lat && pet.lng) {
          L.marker([pet.lat, pet.lng]).addTo(mapInstance)
            .bindPopup(`<b>${pet.name}</b><br>${pet.status} in ${pet.location}<br><button onclick="openModal('${pet.id}')" style="margin-top:5px;">View Info</button>`);
        }
      });
    }
  </script>
</body>
</html>
